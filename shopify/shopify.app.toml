# Santander Credit Calculator — Shopify app.
#
# The theme app extension (extensions/santander-calc) bundles the widget, and
# the widget reads live rates from the Vercel app's /api/rate-card, so rates
# change without redeploying this app. The app home is a single embedded page
# served by the same Vercel app (web/app/shopify) — required for an App Store
# listing, which extension-only apps can't have.
#
# Linked to the "Santander Credit Calculator" app (1367 Studio) in the Shopify
# Dev Dashboard. Deploy with `npm run deploy`.

client_id = "4633f83c88257455f6bc563f997fb4bc"
name = "Santander Credit Calculator"
handle = "santander-credit-calculator"
application_url = "https://santander-calc.vercel.app/shopify"
embedded = true

[access_scopes]
# Reads nothing from the Admin API — cart and product data come from Liquid
# and the storefront's own /cart.js.
scopes = ""

[webhooks]
api_version = "2027-01"

  # Mandatory privacy webhooks (required for an App Store listing). The app
  # stores no customer or shop data; the Vercel endpoint verifies the HMAC
  # and acknowledges.
  [[webhooks.subscriptions]]
  uri = "https://santander-calc.vercel.app/api/shopify/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
# The app home is on Vercel: keep `shopify app dev` from rewriting the URLs.
automatically_update_urls_on_dev = false

[auth]
# Shopify-managed installation: no OAuth callback is used, but a redirect URL
# on the app's own domain is still required.
redirect_urls = [ "https://santander-calc.vercel.app/api/auth" ]
